<!doctype html>
<html class="no-js" lang="en">
  <head>
      {{ feed_meta }}
      <meta charset="utf-8">
      <title>{{ page.title }}</title>
      <meta name="description" content="">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      {{ page.metatags }}
      <link rel="stylesheet" href="/style.css">
      <script type="text/javascript" src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
      <script>
        function showBibtex(event, text) {
          var el, x, y;

          el = document.getElementById('PopUp');
          if (window.event) {
            x = window.event.clientX + document.documentElement.scrollLeft
                + document.body.scrollLeft;
            y = window.event.clientY + document.documentElement.scrollTop
                + document.body.scrollTop;
          }
          else {
            x = event.clientX + window.scrollX;
            y = event.clientY + window.scrollY;
          }
          x -= 2; y -= 2;
          y = y+15;
          el.style.left = x + "px";
          el.style.top = y + "px";
          el.style.display = "block";
          document.getElementById('PopUpText').innerHTML = text;
       }
    </script>
    <link rel="alternate" type="application/atom+xml" title="Olof Mogren, PhD" href="/feed.xml">
  </head>
  <body>

  <!-- Static EUMETSAT Hero & Mathematically True Orthographic Graticule (0°N, 0°E) -->
  <div class="eumetsat-hero-stage" aria-hidden="true">
    <svg class="hero-orbital-svg" viewBox="0 0 1440 460" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="earth-sphere-clip">
          <circle cx="860" cy="290" r="260" />
        </clipPath>
        <radialGradient id="atmo-limb-glow" cx="50%" cy="50%" r="50%">
          <stop offset="86%" stop-color="#0ea5e9" stop-opacity="0" />
          <stop offset="96%" stop-color="#38bdf8" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.48" />
        </radialGradient>
        <radialGradient id="sphere-vignette" cx="42%" cy="38%" r="60%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.08" />
          <stop offset="70%" stop-color="#030710" stop-opacity="0.32" />
          <stop offset="100%" stop-color="#02050b" stop-opacity="0.68" />
        </radialGradient>
      </defs>

      <!-- Subtle Atmospheric Rim Glow -->
      <circle cx="860" cy="290" r="268" fill="url(#atmo-limb-glow)" />

      <!-- Clipped Earth Disk + Orthographic Grid -->
      <g clip-path="url(#earth-sphere-clip)">
        <circle cx="860" cy="290" r="260" fill="#040b16" />

        <!-- Leading slash ensures image loads on subpages like /publications/ too -->
        <image
          href="/graphics/eumetsat-earth-mtg-i2-2026-10-25-10-45.webp"
          x="600" y="30" width="520" height="520"
          preserveAspectRatio="xMidYMid slice"
          style="filter: brightness(0.84) contrast(1.08) saturate(1.04);"
        />

        <circle cx="860" cy="290" r="260" fill="url(#sphere-vignette)" />

        <!-- Orthographic Graticule Centered at (0°N, 0°E), R = 260 -->
        <g class="ortho-graticule" stroke="rgba(186, 230, 253, 0.22)" stroke-width="0.85" fill="none">
          <!-- Parallels of Latitude: y = 290 - 260*sin(lat) -->
          <line x1="792.71" y1="38.86"  x2="927.29" y2="38.86" />  <!-- 75°N -->
          <line x1="730.00" y1="64.83"  x2="990.00" y2="64.83" />  <!-- 60°N -->
          <line x1="676.15" y1="106.15" x2="1043.85" y2="106.15" /><!-- 45°N -->
          <line x1="634.83" y1="160.00" x2="1085.17" y2="160.00" /><!-- 30°N -->
          <line x1="608.86" y1="222.71" x2="1111.14" y2="222.71" /><!-- 15°N -->
          <line x1="600.00" y1="290.00" x2="1120.00" y2="290.00" stroke="rgba(125, 211, 252, 0.42)" stroke-width="1.2" /> <!-- 0° Equator -->
          <line x1="608.86" y1="357.29" x2="1111.14" y2="357.29" /><!-- 15°S -->
          <line x1="634.83" y1="420.00" x2="1085.17" y2="420.00" /><!-- 30°S -->

          <!-- Dashed Arctic Circle (66.56°N) & Tropic of Cancer (23.44°N) -->
          <line x1="756.57" y1="51.48"  x2="963.43" y2="51.48" stroke="rgba(125, 211, 252, 0.34)" stroke-dasharray="4 4" />
          <line x1="621.48" y1="186.57" x2="1098.52" y2="186.57" stroke="rgba(125, 211, 252, 0.24)" stroke-dasharray="3 5" />

          <!-- Meridians of Longitude: Semi-Ellipses rx = 260*|sin(lon)|, ry = 260 -->
          <line x1="860" y1="30" x2="860" y2="550" stroke="rgba(125, 211, 252, 0.42)" stroke-width="1.2" /> <!-- 0° Prime Meridian -->
          <path d="M 860 30 A 67.29 260 0 0 1 860 550" />  <!-- 15°E -->
          <path d="M 860 30 A 67.29 260 0 0 0 860 550" />  <!-- 15°W -->
          <path d="M 860 30 A 130.00 260 0 0 1 860 550" /> <!-- 30°E -->
          <path d="M 860 30 A 130.00 260 0 0 0 860 550" /> <!-- 30°W -->
          <path d="M 860 30 A 183.85 260 0 0 1 860 550" /> <!-- 45°E -->
          <path d="M 860 30 A 183.85 260 0 0 0 860 550" /> <!-- 45°W -->
          <path d="M 860 30 A 225.17 260 0 0 1 860 550" /> <!-- 60°E -->
          <path d="M 860 30 A 225.17 260 0 0 0 860 550" /> <!-- 60°W -->
          <path d="M 860 30 A 251.14 260 0 0 1 860 550" /> <!-- 75°E -->
          <path d="M 860 30 A 251.14 260 0 0 0 860 550" /> <!-- 75°W -->
        </g>

        <!-- True Nordic Reference Marker: (57.7°N, 12.0°E) -> (x=888.88, y=70.23) -->
        <g class="nordic-marker">
          <circle cx="888.88" cy="70.23" r="5.5" fill="none" stroke="rgba(56, 189, 248, 0.65)" stroke-width="1" />
          <circle cx="888.88" cy="70.23" r="2.2" fill="#38bdf8" />
        </g>
      </g>

      <!-- Outer Geostationary Limb Ring -->
      <circle cx="860" cy="290" r="260" fill="none" stroke="rgba(125, 211, 252, 0.38)" stroke-width="1.15" />
    </svg>
    <div class="hero-horizon-edge"></div>
  </div>

  <!-- Restored Site Header & Navigation over the Orbital Hero -->
  <header id="header" class="site-header">
    <h1><a href="/">Olof Mogren</a></h1>
    <p class="subtitle">Deep learning researcher, PhD.</p>
    <nav id="navigation">
      <ul>
        <li><a href="/publications/">Publications</a></li>

        <li><a href="/about/">About</a></li>
        <li><a href="https://ridr.se/">Research Group</a></li>
      </ul>
    </nav>

  <div class="page-wrapper">
      <div id="PopUp" style="display: none; position: absolute; left: 100px; top: 50px; border: solid black 1px; padding: 10px; background-color: rgb(200,200,200); text-align: justify; font-size: 12px; min-width: 400px; z-index: 100;">
        <pre id="PopUpText">TEXT</pre>
        <input name="close" type="button" value="Close" onclick="document.getElementById('PopUp').style.display = 'none';" />
      </div>
<!-- content goes here: //-->
