<!doctype html>
<html class="no-js" lang="en">
  <head>
      {{ feed_meta }}
      <meta charset="utf-8">
      <title>{{ page.title }}</title>
      <meta name="description" content="">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      {{ page.metatags }}
      <link rel="stylesheet" href="/style.css">
      <script type="text/javascript" src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
      <script>
        function showBibtex(event, text) {
          var el, x, y;

          el = document.getElementById('PopUp');
          if (window.event) {
            x = window.event.clientX + document.documentElement.scrollLeft
                + document.body.scrollLeft;
            y = window.event.clientY + document.documentElement.scrollTop
                + document.body.scrollTop;
          }
          else {
            x = event.clientX + window.scrollX;
            y = event.clientY + window.scrollY;
          }
          x -= 2; y -= 2;
          y = y+15;
          el.style.left = x + "px";
          el.style.top = y + "px";
          el.style.display = "block";
          document.getElementById('PopUpText').innerHTML = text;
       }
    </script>
    <link rel="alternate" type="application/atom+xml" title="Olof Mogren, PhD" href="/feed.xml">
  </head>
  <body>

    <!-- Static EUMETSAT Hero with External Deep-Space Coordinate Grid -->
  <div class="eumetsat-hero-stage" aria-hidden="true">
    <svg class="hero-orbital-svg" viewBox="0 0 1440 460" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="earth-sphere-clip">
          <circle cx="860" cy="290" r="260" />
        </clipPath>
        <!-- Mask so the coordinate grid only appears OUTSIDE the Earth disk -->
        <mask id="outside-earth-mask">
          <rect x="0" y="0" width="1440" height="460" fill="white" />
          <circle cx="860" cy="290" r="260" fill="black" />
        </mask>
        <radialGradient id="atmo-limb-glow" cx="50%" cy="50%" r="50%">
          <stop offset="86%" stop-color="#0ea5e9" stop-opacity="0" />
          <stop offset="96%" stop-color="#38bdf8" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.48" />
        </radialGradient>
        <radialGradient id="sphere-vignette" cx="42%" cy="38%" r="60%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.06" />
          <stop offset="70%" stop-color="#030710" stop-opacity="0.28" />
          <stop offset="100%" stop-color="#02050b" stop-opacity="0.65" />
        </radialGradient>
      </defs>

      <!-- 1. EXTERNAL DEEP-SPACE COORDINATE GRID (Masked out inside the globe) -->
      <g mask="url(#outside-earth-mask)">
        <g stroke="rgba(148, 196, 232, 0.14)" stroke-width="0.85" fill="none">
          <!-- Concentric Orbital Range Rings around the Globe (cx=860, cy=290) -->
          <circle cx="860" cy="290" r="320" stroke="rgba(125, 211, 252, 0.22)" stroke-dasharray="4 6" />
          <circle cx="860" cy="290" r="390" />
          <circle cx="860" cy="290" r="475" />
          <circle cx="860" cy="290" r="575" />
          <circle cx="860" cy="290" r="690" />
          <circle cx="860" cy="290" r="820" />

          <!-- True Projected Latitude Planes Extending into Space: y = 290 - 260*sin(lat) -->
          <line x1="0" y1="38.86"  x2="1440" y2="38.86" />  <!-- 75°N -->
          <line x1="0" y1="64.83"  x2="1440" y2="64.83" />  <!-- 60°N -->
          <line x1="0" y1="106.15" x2="1440" y2="106.15" /> <!-- 45°N -->
          <line x1="0" y1="160.00" x2="1440" y2="160.00" /> <!-- 30°N -->
          <line x1="0" y1="222.71" x2="1440" y2="222.71" /> <!-- 15°N -->
          <line x1="0" y1="290.00" x2="1440" y2="290.00" stroke="rgba(125, 211, 252, 0.26)" stroke-width="1.05" /> <!-- 0° Equator -->
          <line x1="0" y1="357.29" x2="1440" y2="357.29" /> <!-- 15°S -->
          <line x1="0" y1="420.00" x2="1440" y2="420.00" /> <!-- 30°S -->

          <!-- Radial Limb Azimuth Rays from Globe Center (15° increments) -->
          <line x1="860" y1="290" x2="860"  y2="-30" stroke="rgba(125, 211, 252, 0.24)" /> <!-- 90°N Pole Axis -->
          <line x1="860" y1="290" x2="260"  y2="-56" />
          <line x1="860" y1="290" x2="0"    y2="60"  />
          <line x1="860" y1="290" x2="1440" y2="-45" />
          <line x1="860" y1="290" x2="1440" y2="135" />
        </g>

        <!-- Limb Degree Ticks Just Outside the Atmosphere (R=266 to R=274) -->
        <g stroke="rgba(125, 211, 252, 0.45)" stroke-width="1.1">
          <!-- Left Limb Ticks (0°, 15°N, 30°N, 45°N, 60°N, 75°N) -->
          <line x1="586" y1="290.00" x2="594" y2="290.00" />
          <line x1="595" y1="220.64" x2="603" y2="222.71" />
          <line x1="622" y1="156.00" x2="630" y2="160.00" />
          <line x1="666" y1="100.50" x2="672" y2="106.15" />
          <line x1="723" y1="57.90"  x2="727" y2="64.83"  />
          <!-- Right Limb Ticks (0°, 15°N, 30°N, 45°N, 60°N, 75°N) -->
          <line x1="1126" y1="290.00" x2="1134" y2="290.00" />
          <line x1="1117" y1="222.71" x2="1125" y2="220.64" />
          <line x1="1090" y1="160.00" x2="1098" y2="156.00" />
          <line x1="1048" y1="106.15" x2="1054" y2="100.50" />
          <line x1="993"  y1="64.83"  x2="997"  y2="57.90"  />
        </g>

        <!-- Subtle True Latitude Labels in External Space -->
        <g fill="rgba(148, 196, 232, 0.42)" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="0.06em">
          <!-- Left Margin Labels -->
          <text x="24" y="61">60°N</text>
          <text x="24" y="156">30°N</text>
          <text x="24" y="286">0° EQ</text>
          <text x="24" y="416">30°S</text>

          <!-- Right Margin Labels -->
          <text x="1416" y="61"  text-anchor="end">60°N</text>
          <text x="1416" y="156" text-anchor="end">30°N</text>
          <text x="1416" y="286" text-anchor="end">0° EQ</text>
          <text x="1416" y="416" text-anchor="end">30°S</text>

          <!-- Near-Limb Coordinate Callouts -->
          <text x="714" y="54"  text-anchor="end">60°N · 90°W LIMB</text>
          <text x="1006" y="54" text-anchor="start">60°N · 90°E LIMB</text>
        </g>
      </g>

      <!-- 2. ATMOSPHERIC RIM GLOW -->
      <circle cx="860" cy="290" r="268" fill="url(#atmo-limb-glow)" />

      <!-- 3. CLEAN, UNOBSTRUCTED EUMETSAT EARTH DISK -->
      <g clip-path="url(#earth-sphere-clip)">
        <circle cx="860" cy="290" r="260" fill="#040b16" />
        <image
          href="/graphics/eumetsat-earth-mtg-i2-2026-10-25-10-45.webp"
          x="600" y="30" width="520" height="520"
          preserveAspectRatio="xMidYMid slice"
          style="filter: brightness(0.84) contrast(1.08) saturate(1.04);"
        />
        <circle cx="860" cy="290" r="260" fill="url(#sphere-vignette)" />
      </g>

      <!-- 4. OUTER GEOSTATIONARY LIMB RING -->
      <circle cx="860" cy="290" r="260" fill="none" stroke="rgba(125, 211, 252, 0.38)" stroke-width="1.15" />
    </svg>
    <div class="hero-horizon-edge"></div>
  </div>

  <!-- Restored Site Header & Navigation over the Orbital Hero -->
  <header id="header" class="site-header">
    <h1><a href="/">Olof Mogren</a></h1>
    <p class="subtitle">Machine learning researcher.</p>
    <nav id="navigation">
      <ul>
        <li><a href="/publications/">Publications</a></li>
        <li><a href="/talks/">Talks</a></li>
        <li><a href="/about/">About</a></li>
        <li><a href="/group/">Research group</a></li>
      </ul>
    </nav>
  </header>

  <div class="page-wrapper">
      <div id="PopUp" style="display: none; position: absolute; left: 100px; top: 50px; border: solid black 1px; padding: 10px; background-color: rgb(200,200,200); text-align: justify; font-size: 12px; min-width: 400px; z-index: 100;">
        <pre id="PopUpText">TEXT</pre>
        <input name="close" type="button" value="Close" onclick="document.getElementById('PopUp').style.display = 'none';" />
      </div>
<!-- content goes here: //-->
